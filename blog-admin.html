<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Blog admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c0c0c;--mut:#667085;--line:#e6e8ec;--bg:#f6f7f9}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit}
.btn{background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;display:inline-block;text-decoration:none}
.btn.s{background:#fff;color:var(--ink);border-color:var(--line)}.btn.d{background:#fff;color:#b42318;border-color:#fda29b}.btn.sm{padding:5px 10px;font-size:12px}
input,select,textarea{width:100%;border:1px solid #d0d5dd;border-radius:8px;padding:9px 11px;background:#fff}
textarea{min-height:90px;resize:vertical}label{display:block;font-weight:600;margin:14px 0 5px}.hint{color:var(--mut);font-size:12px;font-weight:400}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:360px;border:1px solid var(--line)}
.box h1{font-size:20px;margin-bottom:4px}.err{color:#b42318;margin-top:10px;min-height:18px}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lg{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);object-fit:cover;display:block}
header b{font-size:16px;margin-right:8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--mut);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
main{max-width:860px;margin:24px auto;padding:0 16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row img,.row .ph{width:64px;height:44px;border-radius:8px;object-fit:cover;background:#e5e7eb;flex:none}
.row .t{flex:1;min-width:0}.row .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .t span{color:var(--mut);font-size:12px}
.pill{background:#eef2ff;color:#3538cd;border-radius:99px;padding:2px 8px;font-size:11px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.prev{margin-top:8px;max-height:140px;border-radius:10px;display:block}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.top h2{font-size:18px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1}[hidden]{display:none!important}
@media(max-width:560px){.two{grid-template-columns:1fr}}

/* ---- Mobile / iPhone 12 (390x844) ---- */
html{-webkit-text-size-adjust:100%;overflow-x:hidden}body{overflow-x:hidden;min-height:100vh;min-height:100dvh;word-break:break-word}
img,iframe,video{max-width:100%}
.btn,.tabs button,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media(max-width:768px){
 header{position:sticky;top:0;z-index:20;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right));gap:8px 10px;flex-wrap:wrap}
 header b{flex:1;margin:0;font-size:15px}
 header>.btn{min-height:36px;display:inline-flex;align-items:center}
 .tabs{order:5;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:6px;margin:2px -14px 0;padding:2px 14px 4px}
 .tabs::-webkit-scrollbar{display:none}
 .tabs button{flex:none;white-space:nowrap;min-height:40px;padding:8px 14px;background:#f2f4f7}
 .tabs button.on{background:var(--ink)}
 main{margin:14px auto;padding:0 12px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));padding-bottom:calc(24px + env(safe-area-inset-bottom))}
 .panel{padding:16px;border-radius:14px}
 .top{gap:10px}.top h2{font-size:17px}
 input,select,textarea{font-size:16px;padding:11px 12px;min-height:44px}
 textarea{min-height:110px}
 input[type=file]{padding:9px;font-size:14px}
 input[type=datetime-local]{-webkit-appearance:none;appearance:none;min-height:44px;display:block}
 label{margin:16px 0 6px}
 .btn{min-height:44px;padding:10px 16px;text-align:center}
 .btn.sm{min-height:40px;padding:8px 14px;font-size:13px}
 .row{flex-wrap:wrap;gap:8px 10px;padding:14px 0}
 .row img,.row .ph{width:72px;height:52px}
 .row .t{flex:1 1 calc(100% - 90px)}
 .row .t b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
 .row .pill{order:3}
 .row .btn{order:4;flex:1 1 0;min-width:0;display:inline-flex;align-items:center;justify-content:center}
 .prev{max-width:100%;height:auto}
 #toast{bottom:calc(20px + env(safe-area-inset-bottom));max-width:calc(100% - 28px);width:max-content;text-align:center;border-radius:14px;font-size:13px;z-index:50}
 #login{padding:20px;padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom))}
 .box{padding:22px}
 #aiw .btn{flex:1 1 100%}
}
@media(max-width:420px){
 .top{flex-wrap:wrap}
 #sp,[data-go=posts].btn.s{flex:1}
 .panel div[style*="display:flex"]{flex-wrap:wrap}
}
</style></head><body>
<div id="login"><form class="box" id="lf"><img class="lg" alt="" style="width:56px;height:56px;margin-bottom:12px"><h1>Blog admin</h1><p class="hint">Sign in to manage posts and page content.</p>
<label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required>
<button class="btn" style="width:100%;margin-top:16px">Sign in</button><p class="err" id="le"></p></form></div>
<div id="app" hidden>
<header><img class="lg" alt=""><b>Blog admin</b><div class="tabs" id="tabs"></div><a class="btn s sm" href="blog.html" target="_blank">View blog</a><button class="btn s sm" id="out">Sign out</button></header>
<main id="main"></main></div><div id="toast"></div>

const yt=u=>(String(u||'').match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/)||[])[1];

// Apps Script expects a plain-text POST body (avoids browser preflight)
async function call(action,data={}){
 const r=await fetch(APPS_URL,{method:'POST',body:JSON.stringify({action,token:tok,...data})});
 const d=await r.json();
 if(!d.ok){if(/expired/i.test(d.error||'')){sessionStorage.clear();toast(d.error);setTimeout(()=>location.reload(),1200)}throw new Error(d.error||'Request failed')}
 return d}
async function fetchAll(){
 if(LIVE){const d=await call('list');posts=d.posts||[];if(d.settings)merge(S,d.settings)}
 else{posts=JSON.parse(localStorage.getItem('bg_blog_posts')||'[]');const s=localStorage.getItem('bg_blog_settings');if(s)merge(S,JSON.parse(s))}}
const saveSettings=async()=>LIVE?call('saveSettings',{settings:S}):localStorage.setItem('bg_blog_settings',JSON.stringify(S));
async function savePost(p){
 if(LIVE){await call('savePost',{post:p});await fetchAll()}
 else{if(p.id)posts=posts.map(x=>x.id===p.id?p:x);else posts.unshift({...p,id:'p'+Date.now()});localStorage.setItem('bg_blog_posts',JSON.stringify(posts))}}
async function delPost(id){
 if(LIVE){await call('deletePost',{id});await fetchAll()}
 else{posts=posts.filter(x=>x.id!==id);localStorage.setItem('bg_blog_posts',JSON.stringify(posts))}}
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1400/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};i.src=URL.createObjectURL(f)});
async function upload(f){
 const u=await shrink(f);
 if(!LIVE)return u;
 return (await call('upload',{data:u.split(',')[1],name:f.name.replace(/\.\w+$/,'')+'.jpg',type:'image/jpeg'})).url}
function field(p,label,kind,hint,v){
 const id='f_'+p.replace(/\./g,'_');
 if(kind==='area')return`<label for="${id}">${label}</label><textarea id="${id}" data-p="${p}">${esc(v)}</textarea>`;
 if(kind==='img')return`<label for="${id}">${label} <span class="hint">upload a file or paste a link</span></label><input id="${id}" data-p="${p}" value="${esc(v)}" placeholder="https://…"><input type="file" accept="image/*" data-for="${id}" style="margin-top:6px"><img class="prev" id="${id}_pv" ${v?`src="${esc(v)}"`:'hidden'} alt="">`;
 return`<label for="${id}">${label} ${hint?`<span class="hint">${hint}</span>`:''}</label><input id="${id}" data-p="${p}" value="${esc(v)}">`}
function view(v){
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 const m=$('#main');
 if(v==='posts'){m.innerHTML=`<div class="panel"><div class="top"><h2>Posts (${posts.length})</h2><button class="btn" data-go="new">New post</button></div>${posts.map(p=>{const t=p.image_url||(yt(p.youtube_url)?`https://img.youtube.com/vi/${yt(p.youtube_url)}/default.jpg`:'');return`<div class="row">${t?`<img src="${esc(t)}" alt="">`:'<div class="ph"></div>'}<div class="t"><b>${esc(p.title)}</b><span>${new Date(p.published_at).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})} · ${esc(p.category||'No category')}</span></div>${new Date(p.published_at)>new Date()?'<span class="pill" style="background:#fef3c7;color:#92400e">Scheduled</span>':''}<span class="pill">${esc(p.type)}</span><button class="btn s sm" data-edit="${esc(p.id)}">Edit</button><button class="btn d sm" data-del="${esc(p.id)}">Delete</button></div>`}).join('')||'<p class="hint" style="padding:20px 0">No posts yet. Add your first one.</p>'}</div>`}
 else if(v==='edit'){const p=cur||{type:'article',published_at:new Date().toISOString()};
  m.innerHTML=`<div class="panel"><div class="top"><h2>${p.id?'Edit post':'New post'}</h2></div>
  <div class="two"><div><label for="p_type">Post type</label><select id="p_type"><option value="article">Article</option><option value="video">Video</option><option value="podcast">Podcast</option></select></div><div><label for="p_date">Publish date and time <span class="hint">a future time schedules the post</span></label><input type="datetime-local" id="p_date" value="${toLocalInput(p.published_at)}"></div></div>
  <label for="p_cat">Category <span class="hint">becomes a filter on the blog, e.g. Computer science, Analytics, Career</span></label><input id="p_cat" list="cats" value="${esc(p.category)}"><datalist id="cats">${[...new Set(posts.map(x=>x.category).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <label for="p_title">Title</label><input id="p_title" value="${esc(p.title)}">
  <label for="p_ex">Short description <span class="hint">shown on the card</span></label><textarea id="p_ex" style="min-height:60px">${esc(p.excerpt)}</textarea>
  <label for="p_ct">Full post <span class="hint">blank line = new paragraph</span></label><textarea id="p_ct" style="min-height:180px">${esc(p.content)}</textarea>
  <label for="p_au">Author</label><input id="p_au" value="${esc(p.author||S.brand.name)}">
  ${field('image_url','Cover image','img','',p.image_url||'')}
  <label for="p_yt">YouTube link <span class="hint">optional. Turns the card into a video card with a play button</span></label><input id="p_yt" value="${esc(p.youtube_url)}" placeholder="https://www.youtube.com/watch?v=…">
  <div style="margin-top:20px;display:flex;gap:8px"><button class="btn" id="sp">${p.id?'Save changes':'Publish post'}</button><button class="btn s" data-go="posts">Cancel</button></div></div>`;
  $('#p_type').value=p.type||'article'}
 else if(v==='ai'){m.innerHTML=`<div class="panel" id="aiw"><div class="top"><h2>AI prompt builder</h2></div><p class="hint">Pick a template, fill in the details, copy the prompt into any AI model, then paste its answer into New post (Title, Short description, Category and Post match the form fields).</p>
  <label for="ai_t">Template (20)</label><select id="ai_t">${Object.entries(CATS).map(([c,n])=>`<optgroup label="${n}">${TPL.map((t,i)=>t[0]===c?`<option value="${i}">${esc(t[1])}</option>`:'').join('')}</optgroup>`).join('')}</select>
  <div id="ai_f">${aiFields(0)}</div>
  <div class="two"><div><label for="ai_aud">Audience</label><input id="ai_aud" value="university students and early-career engineers"></div><div><label for="ai_lang">Language</label><input id="ai_lang" value="English"></div>
  <div><label for="ai_tone">Tone</label><select id="ai_tone"><option>friendly and clear</option><option>professional</option><option>conversational</option><option>academic but readable</option></select></div>
  <div><label for="ai_len">Length</label><select id="ai_len"><option>600</option><option selected>900</option><option>1300</option><option>1800</option></select></div>
  <div><label for="ai_voice">Voice</label><select id="ai_voice"><option>first person (I)</option><option>neutral, no first person</option></select></div></div>
  <label for="ai_out">Your prompt</label><textarea id="ai_out" style="min-height:280px" readonly></textarea>
  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="aic">Copy prompt</button><a class="btn s" href="https://claude.ai/new" target="_blank" rel="noopener">Open Claude</a><a class="btn s" href="https://chatgpt.com/" target="_blank" rel="noopener">Open ChatGPT</a><a class="btn s" href="https://gemini.google.com/app" target="_blank" rel="noopener">Open Gemini</a></div></div>`;aiBuild()}
 else if(v==='acct'){m.innerHTML=`<div class="panel"><div class="top"><h2>Change password</h2></div>${LIVE?'':'<p class="hint">Demo mode: stored in this browser only. Connect the Apps Script for real protection.</p>'}<label for="np">New password <span class="hint">at least 8 characters</span></label><input id="np" type="password" autocomplete="new-password"><div style="margin-top:16px"><button class="btn" id="spw">Update password</button></div></div>`}
 else{const T={hero:'Hero banner',sect:'Site & section texts',foot:'Footer & socials'}[v];
  m.innerHTML=`<div class="panel"><div class="top"><h2>${T}</h2></div><div id="sf">${SPEC[v].map(f=>field(f[0],f[1],f[2],f[3],get(S,f[0])??'')).join('')}</div><div style="margin-top:20px"><button class="btn" id="ss">Save changes</button></div></div>`}}
document.addEventListener('click',async e=>{
 const t=e.target.closest('button');if(!t)return;
 try{
 if(t.dataset.v){if(t.dataset.v==='edit')cur=null;view(t.dataset.v)}
 else if(t.dataset.go){cur=null;view(t.dataset.go==='new'?'edit':'posts')}
 else if(t.dataset.edit){cur=posts.find(p=>String(p.id)===t.dataset.edit);view('edit')}
 else if(t.dataset.del){if(confirm('Delete this post? This cannot be undone.')){await delPost(t.dataset.del);toast('Deleted');view('posts')}}
 else if(t.id==='sp'){
  const title=$('#p_title').value.trim();if(!title)return toast('Add a title first');
  const y=$('#p_yt').value.trim();if(y&&!yt(y))return toast('That YouTube link looks wrong');
  const type=$('#p_type').value;t.disabled=true;
  try{await savePost({id:cur?.id,type:y&&type==='article'?'video':type,category:$('#p_cat').value.trim(),title,excerpt:$('#p_ex').value.trim(),content:$('#p_ct').value,author:$('#p_au').value.trim(),image_url:$('#f_image_url').value.trim(),youtube_url:y,published_at:new Date($('#p_date').value||Date.now()).toISOString()})}finally{t.disabled=false}
  const fut=new Date($('#p_date').value)>new Date();cur=null;toast(fut?'Scheduled':'Published');view('posts')}
 else if(t.id==='ss'){document.querySelectorAll('#sf [data-p]').forEach(i=>put(S,i.dataset.p,i.value.trim()));await saveSettings();toast('Saved')}
 else if(t.id==='spw'){const n=$('#np').value;if(n.length<8)return toast('Use at least 8 characters');
  if(LIVE)await call('changePassword',{newPassword:n});else localStorage.setItem('bg_admin_pw',n);$('#np').value='';toast('Password updated')}
 else if(t.id==='aic'){const o=$('#ai_out');try{await navigator.clipboard.writeText(o.value)}catch{o.select();document.execCommand('copy')}toast('Prompt copied')}
 else if(t.id==='out'){sessionStorage.clear();location.reload()}
 }catch(err){toast('Something went wrong: '+String(err.message).slice(0,80))}});
document.addEventListener('change',async e=>{
 const f=e.target;if(!f.dataset.for||!f.files[0])return;
 try{toast('Uploading…');const u=await upload(f.files[0]);const i=document.getElementById(f.dataset.for);i.value=u;const pv=document.getElementById(f.dataset.for+'_pv');pv.src=u;pv.hidden=false;toast('Image added')}catch(err){toast('Upload failed. Check the script deployment.')}});
document.addEventListener('input',aiEv);document.addEventListener('change',aiEv);
document.addEventListener('input',e=>{if(e.target.id==='p_date'&&!cur?.id)$('#sp').textContent=new Date(e.target.value)>new Date()?'Schedule post':'Publish post';if(e.target.dataset.p){const pv=document.getElementById(e.target.id+'_pv');if(pv){pv.src=e.target.value;pv.hidden=!e.target.value}}});
// ---- AI prompt templates: [category, name, 'key:Label:placeholder|…', prompt with {key}] ----
const CATS={tech:'Tech',sch:'Scholarships',ms:'Masters programs',pr:'Projects',news:'News',th:'Thesis'};
const TPL=[
['tech','Explain a concept','topic:Topic:e.g. vector databases','Write an explainer on "{topic}". Give a plain-language definition, how it works, one real-world example, common mistakes, and when to use it or not.'],
['tech','Step-by-step tutorial','topic:What to build or learn:e.g. a REST API with FastAPI|stack:Tools and versions:e.g. Python 3.12, PostgreSQL','Write a hands-on tutorial on "{topic}" using {stack}. Include prerequisites, numbered steps with short code shown as plain text, how to test it, and troubleshooting tips. Check that commands and package versions are current.'],
['tech','Compare two technologies','a:Option A:e.g. Power BI|b:Option B:e.g. Tableau|use:Use case:e.g. company dashboards','Compare {a} and {b} for {use}. Cover cost, learning curve, performance, ecosystem and limits, then give a clear recommendation for different situations.'],
['tech','Latest trends in a field','field:Field:e.g. generative AI for analytics|focus:Focus (optional):e.g. tools to learn this year','Write about the most important recent developments in {field}, focusing on {focus}. Separate real shifts from hype and say what a student or junior engineer should learn next.'],
['sch','Scholarship guide','name:Scholarship:e.g. Chevening|country:Country or provider:e.g. United Kingdom','Write a complete guide to the {name} scholarship ({country}). Cover who can apply, what it pays for, the current application window, required documents, selection steps and common reasons applicants are rejected. Point every deadline to the official page.'],
['sch','Open scholarships roundup','level:Study level:e.g. masters|field:Field or country:e.g. computer science in Europe|n:How many:e.g. 8','Write a roundup of {n} scholarships that are open now or opening soon for {level} students in {field}. For each, give the provider, benefits, eligibility, deadline and official link. Skip any that have closed.'],
['sch','Application tips','name:Scholarship:e.g. DAAD|background:Applicant background:e.g. CS graduate, 2 years of experience','Write practical advice on winning the {name} scholarship for this applicant: {background}. Cover the motivation letter, recommendation letters, CV, interview and a month-by-month timeline.'],
['ms','Program review','program:Program:e.g. MSc Data Science|uni:University:e.g. TU Munich','Write a review of the {program} at {uni}. Cover curriculum, admission requirements, tuition and living costs, language needs, funding, career outcomes and who it suits.'],
['ms','Compare programs or countries','field:Field:e.g. business analytics|places:Countries or universities:e.g. Germany, Netherlands, Canada','Compare masters programs in {field} across {places}. Use the same criteria for each: tuition, duration, entry requirements, scholarships, job market and post-study visa options.'],
['ms','Admission roadmap','field:Field:e.g. computer science|country:Country:e.g. Germany|background:Your background:e.g. final-year BSc student','Write an admission roadmap for a masters in {field} in {country} for someone with this background: {background}. Give a month-by-month plan covering language tests, documents, applications, funding and visa.'],
['pr','Project ideas','area:Skill or area:e.g. SQL and Power BI|level:Level:e.g. beginner to intermediate|n:How many:e.g. 10','Suggest {n} project ideas in {area} for {level} learners. For each, give the goal, data sources, tools, expected output, difficulty and what it shows to employers.'],
['pr','Project write-up','name:Project name:|what:What it does:|stack:Tech stack:|results:Results or lessons:','Write a case study of my project "{name}" using only these facts. What it does: {what}. Stack: {stack}. Results and lessons: {results}. Explain the problem, my approach, key decisions, challenges and what I would improve. Do not add features or numbers I did not give you.'],
['pr','Build walkthrough','name:Project:e.g. sales dashboard|stack:Stack:e.g. Python, SQL, Streamlit|steps:Main steps (optional):','Write a walkthrough of how to build "{name}" with {stack}. Main steps: {steps}. Explain the design choices, show key snippets as plain text and end with ideas to extend it.'],
['news','News summary','topic:Topic:e.g. AI regulation|days:Past how many days:e.g. 7','Summarize the most important news about {topic} from the past {days} days. Group stories by theme, give the date and source of each, and explain in one line why it matters.'],
['news','News analysis','event:Event or announcement:|who:Who it affects:e.g. students and junior developers','Explain what "{event}" means for {who}. Cover what happened, background, likely effects, different viewpoints and what readers could do about it.'],
['news','Weekly digest','field:Field:e.g. data and analytics|n:Number of items:e.g. 5','Write a weekly digest for {field} with the {n} most useful items from the past 7 days: news, tools, research or opportunities. Give each a short summary, date, source and why it is worth reading.'],
['th','Thesis topic ideas','field:Field:e.g. business analytics|level:Level:e.g. masters|interest:Interests:e.g. retail forecasting, NLP','Suggest 8 thesis topics in {field} for a {level} student interested in {interest}. For each give the research question, possible data, method, feasibility and why it is timely now.'],
['th','Literature review overview','topic:Topic:|years:Years to focus on:e.g. 2020 to now','Write an overview of the research on "{topic}" from {years}. Cover main themes, key findings, open debates and research gaps. Name only papers you can verify and give links or DOIs.'],
['th','Choosing a research method','topic:Research topic:|data:Data you have or can get:','Explain how to choose a research method for a thesis on "{topic}" given this data: {data}. Compare quantitative, qualitative and mixed approaches, name suitable statistical or ML methods, and describe common validity threats.'],
['th','Share my thesis','title:Thesis title:|findings:Main findings:|method:Method and data:','Write a reader-friendly post about my thesis "{title}" using only these facts. Method and data: {method}. Findings: {findings}. Explain the question, why it matters, how I did it, what I found, limits and next steps in plain language. Do not invent results.']];
const aiFields=i=>TPL[i][2].split('|').map(f=>f.split(':')).map(([k,l,p])=>`<label for="a_${k}">${l}</label><input id="a_${k}" placeholder="${esc(p)}">`).join('');
function aiBuild(){
 const t=TPL[$('#ai_t').value];let body=t[3];
 t[2].split('|').forEach(f=>{const k=f.split(':')[0];body=body.split('{'+k+'}').join($('#a_'+k).value.trim()||'(choose a sensible option)')});
 const today=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
 $('#ai_out').value=`You are helping me write a post for my personal blog. I am a computer science and business analytics engineer${S.brand.name?' ('+S.brand.name+')':''}.

Today's date is ${today}. If you can browse or search the web, base the post on the most recent reliable sources, with official sites first. If you cannot verify something, say so instead of guessing. Never invent deadlines, fees, rankings, quotes, papers or statistics.

TASK
${body}

AUDIENCE: ${$('#ai_aud').value}
TONE: ${$('#ai_tone').value}
LENGTH: about ${$('#ai_len').value} words
LANGUAGE: ${$('#ai_lang').value}
VOICE: ${$('#ai_voice').value}

FORMAT (plain text only, no markdown symbols, no emojis, no tables):
Title: one line, under 70 characters
Short description: under 160 characters, for the blog card
Category: one of Computer science, Analytics, Career, Scholarships, Masters, Projects, News, Thesis
Post: short paragraphs separated by one blank line. A heading is a short line on its own with a blank line before and after it.
Sources: every link you used, with the date you checked it. Keep links out of the post text.
Check before publishing: every deadline, fee, date or number I should confirm on the official page.`}
function aiEv(e){if(!e.target.closest('#aiw'))return;if(e.target.id==='ai_t')$('#ai_f').innerHTML=aiFields(+e.target.value);aiBuild()}
async function start(){$('#login').hidden=true;$('#app').hidden=false;$('#tabs').innerHTML=TABS.map(t=>`<button data-v="${t[0]}">${t[1]}</button>`).join('');try{await fetchAll()}catch(e){toast('Could not load data. Check APPS_URL.')}view('posts')}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';const b=e.target.querySelector('button');b.disabled=true;
 try{if(LIVE){const r=await fetch(APPS_URL,{method:'POST',body:JSON.stringify({action:'login',password:$('#lp').value})});const d=await r.json();if(!d.ok)throw 0;tok=d.token;sessionStorage.setItem('bg_tok',tok)}
 else{if($('#lp').value!==pw())throw 0;sessionStorage.setItem('bg_ok','1')}start()}catch{$('#le').textContent='Wrong password, or the script URL is not reachable. Try again.'}b.disabled=false};
if(authed())start();
</script></body></html>
