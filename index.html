<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portfolio</title><link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c0c0c;--mut:#667085;--bg:#f9f9f9;--card:#fff;--line:#ececec;--r:20px}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding:12px;overflow-x:hidden}
.w{max-width:1080px;margin:0 auto;display:grid;gap:12px}
a{color:inherit;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(20px,4vw,36px)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 20px;border-radius:12px;font:600 14px inherit;border:1px solid var(--ink);cursor:pointer}
.btn.d{background:var(--ink);color:#fff}
.pill{display:inline-block;background:#f2f4f7;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600}
.nav{display:flex;align-items:center;gap:12px;padding:12px 20px;flex-wrap:wrap}
.av{width:36px;height:36px;border-radius:50%;background:var(--ink) center/cover;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.st{background:#ecfdf3;color:#067647}.st.busy{background:#fef3f2;color:#b42318}
.nav nav{margin-left:auto;display:flex;gap:20px;font-size:14px;font-weight:500}
h1{font-size:clamp(30px,6vw,56px);line-height:1.08;letter-spacing:-.025em;font-weight:600;max-width:760px}
.sub{color:var(--mut);max-width:620px;margin:18px 0 26px;font-size:16px}
.hero .row{display:flex;gap:10px;flex-wrap:wrap}
h2{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-bottom:18px}
.g{display:grid;gap:12px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.m b{display:block;font-size:clamp(32px,5vw,48px);letter-spacing:-.02em}.m span{font-weight:600}.m p{color:var(--mut);font-size:13px}
.phil p{font-size:clamp(18px,3vw,26px);line-height:1.4;font-weight:500;max-width:860px}
.proj .th{aspect-ratio:16/9;border-radius:14px;background:linear-gradient(135deg,#e4e8ef,#f3f4f6) center/cover;margin-bottom:16px}
.proj h3{font-size:20px;margin:10px 0}.proj dt{font-size:12px;font-weight:700;color:var(--mut);margin-top:12px;text-transform:uppercase}.proj dd{font-size:14px}
.proj .imp{background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;margin-top:14px;font-weight:600;font-size:14px}
.tg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dm h3{font-size:16px;margin:10px 0 14px}.dm .pill.l{background:#ecfdf3;color:#067647;float:right}
.q p{font-size:clamp(18px,3vw,24px);font-weight:500;max-width:760px}.q .by{display:flex;gap:12px;align-items:center;margin-top:20px}.q small{color:var(--mut);display:block}
.star{color:#f5b301;letter-spacing:2px}
.cl{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.cl:last-child{border:0}.cl small{color:var(--mut)}
.ct{background:var(--ink);color:#fff;text-align:center;border-color:var(--ink)}.ct h2{color:#a0a4ab}.ct .big{font-size:clamp(22px,4vw,36px);font-weight:600}
.ct .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}.ct .btn{border-color:#555;color:#fff}.ct .btn.d{background:#fff;color:#000}
@media(max-width:768px){.nav nav{display:none}.g3,.g2{grid-template-columns:1fr}body{padding:10px;padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:calc(10px + env(safe-area-inset-bottom))}.hero .btn{flex:1}}

/* Glassmorphism */
body{background:transparent}body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(620px 420px at 8% 0,#c7d2fe,transparent 62%),radial-gradient(520px 520px at 100% 18%,#fbcfe8,transparent 60%),radial-gradient(640px 520px at 28% 100%,#a5f3fc,transparent 60%),#f4f5fb}
.card{background:rgba(255,255,255,.5);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 34px rgba(60,64,140,.12),inset 0 1px 0 rgba(255,255,255,.9);transition:transform .25s,box-shadow .25s}
a.card:hover,.proj:hover,.m:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(60,64,140,.18),inset 0 1px 0 #fff}
header.nav{position:sticky;top:8px;z-index:20;background:rgba(255,255,255,.62)}
.av{background-color:#fff;border:2px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.nav .av{width:42px;height:42px}
.pill{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.85)}
.st{background:rgba(209,250,229,.7)}.st.busy{background:rgba(254,226,226,.75)}
.btn:not(.d){background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.9);color:var(--ink)}
.btn.d{box-shadow:0 6px 18px rgba(12,12,12,.25)}
.proj .th{border:1px solid rgba(255,255,255,.8)}
.proj .imp{background:rgba(12,12,12,.82)}
.ct{background:rgba(14,16,32,.72);border:1px solid rgba(255,255,255,.18)}
.ct .btn:not(.d){background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.cl{border-color:rgba(0,0,0,.07)}
.cp{margin-top:28px;font-size:12px;color:rgba(255,255,255,.45)}#hx{cursor:default;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
</style></head><body><div class="w" id="app"></div>
<script src="data.js"></script>
<script>
let D=load(),S=D.site;const A=['','★','★★','★★★','★★★★','★★★★★'];
const ini=n=>esc((n||'?').trim()[0]||'?').toUpperCase();
const av=(u,n)=>`<span class="av" style="${u?`background-image:url('${esc(safe(u))}')`:''}">${u?'':ini(n)}</span>`;
const R={
metrics:()=>D.metrics.length&&`<div class="g g3" id="analytics">${D.metrics.map(m=>`<div class="card m"><b>${esc(m.value)}</b><span>${esc(m.label)}</span><p>${esc(m.sub)}</p></div>`).join('')}</div>`,
philosophy:()=>S.philosophy&&`<div class="card phil" id="about"><h2>Philosophy</h2><p>${esc(S.philosophy)}</p></div>`,
projects:()=>D.projects.length&&`<div id="projects"><h2 style="padding:8px 4px 0">Featured projects</h2><div class="g g2">${D.projects.map(p=>`<article class="card proj"><div class="th" style="${p.thumb?`background-image:url('${esc(safe(p.thumb))}')`:''}"></div><span class="pill">${esc(p.category)}</span><h3>${esc(p.title)}</h3><dl><dt>Situation &amp; Task</dt><dd>${esc(p.problem)}</dd><dt>Tech stack</dt><dd class="tg">${tags(p.stack).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</dd><dt>Action</dt><dd>${esc(p.action)}</dd></dl><div class="imp">Outcome: ${esc(p.impact)}</div><div class="tg" style="margin-top:14px">${p.demo?`<a class="btn d" href="${esc(safe(p.demo))}" target="_blank" rel="noopener">Live demo</a>`:''}${p.repo?`<a class="btn" href="${esc(safe(p.repo))}" target="_blank" rel="noopener">GitHub</a>`:''}</div></article>`).join('')}</div></div>`,
demos:()=>D.demos.length&&`<div><h2 style="padding:8px 4px 0">Live demos &amp; artifacts</h2><div class="g g3">${D.demos.map(d=>`<a class="card dm" href="${esc(safe(d.url))}" target="_blank" rel="noopener"><span class="pill l">● ${esc(d.status)}</span><span class="pill">${esc(d.type)}</span><h3>${esc(d.title)}</h3><span style="font-weight:600;font-size:14px">Open ↗</span></a>`).join('')}</div></div>`,
skills:()=>D.skills.length&&`<div id="skills"><h2 style="padding:8px 4px 0">Skills</h2><div class="g g2">${D.skills.map(s=>`<div class="card"><h3 style="font-size:17px;margin-bottom:12px">${esc(s.cat)}</h3><div class="tg">${tags(s.tags).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div></div>`).join('')}</div></div>`,
testimonials:()=>D.testimonials.length&&D.testimonials.map(t=>`<div class="card q"><span class="star">${A[Math.min(5,Math.max(0,t.rating|0))]}</span><p>“${esc(t.quote)}”</p><div class="by">${av(t.photo,t.name)}<div><b>${esc(t.name)}</b><small>${esc(t.role)}${t.company?' · '+esc(t.company):''}</small></div></div></div>`).join(''),
courses:()=>D.courses.length&&`<div class="card"><h2>Coursework, certifications &amp; awards</h2>${D.courses.map(c=>`<div class="cl"><span>${c.url?`<a href="${esc(safe(c.url))}" target="_blank" rel="noopener"><b>${esc(c.title)} ↗</b></a>`:`<b>${esc(c.title)}</b>`}<br><small>${esc(c.kind)}</small></span><small>${esc(c.date)}</small></div>`).join('')}</div>`};
function draw(){const busy=S.status==='busy';
document.title=S.name+' · Portfolio';
$app=document.getElementById('app');
$app.innerHTML=`<header class="card nav">${av(S.photo||'logo.jpg',S.name)}<b>${esc(S.name)}</b><span class="pill st ${busy?'busy':''}">${busy?'🔴 Busy / Working':'🟢 Available for Internships / Roles'}</span><nav><a href="#projects">Projects</a><a href="#analytics">Analytics</a><a href="#skills">Skills</a><a href="#about">About</a><a href="blog.html">Blog</a><a href="#contact">Contact</a></nav></header>
<section class="card hero"><p class="sub" style="margin:0 0 18px;font-weight:600;color:var(--ink)">${esc(S.title)}</p><h1>Bridging Code, Analytics, &amp; Business Strategy.</h1><p class="sub">${esc(S.sub)}</p><div class="row"><a class="btn d" href="#projects">View Projects</a><a class="btn" href="#contact">Contact Me</a></div></section>`
+D.order.filter(s=>s.on&&R[s.id]).map(s=>R[s.id]()||'').join('')
+`<footer class="card ct" id="contact"><h2>Get in touch</h2><div class="big">${esc(S.email)}</div><div class="row"><a class="btn d" href="mailto:${esc(S.email)}">Email me</a><a class="btn" href="${esc(safe(S.linkedin))}" target="_blank" rel="noopener">LinkedIn</a><a class="btn" href="${esc(safe(S.github))}" target="_blank" rel="noopener">GitHub</a><a class="btn" href="blog.html">Read my blog</a>${S.resume?`<a class="btn" href="${esc(safe(S.resume))}" download="resume.pdf">Resume PDF</a>`:''}</div><p class="cp"><span id="hx">©</span> ${new Date().getFullYear()} ${esc(S.name)}. All rights reserved.</p></footer>`;
(()=>{let n=0,t;document.getElementById('hx').onclick=()=>{n++;clearTimeout(t);t=setTimeout(()=>n=0,900);if(n>=3)location.href='portfolioadmin.html'}})();}
draw();fetchRemote().then(d=>{if(d){D=d;S=D.site;draw()}});
</script></body></html>
